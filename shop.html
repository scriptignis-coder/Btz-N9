<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Shop — THE N9 &amp; BTZ</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Libre+Franklin:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <main class="shop-page-static">
    <div class="shop-page-nav">
      <a href="/#shop" class="shop-page-back">← Back to shop</a>
    </div>

    <div class="shop-page-hero">
      <div class="shop-page-hero-media" aria-hidden="true">
        <img src="/shop-banner.jpg" alt="" class="photo-treat">
        <div class="shop-page-hero-scrim"></div>
      </div>
      <span class="shop-page-eyebrow">THE N9 &amp; BTZ — Shop</span>
      <h1 id="category-title">Loading…</h1>
    </div>

    <p id="db-error" class="loading-note" style="display:none;">Catalogue not reachable right now. Try again shortly.</p>

    <div class="shop-page-cols">
      <div class="shop-page-col">
        <h2>Men</h2>
        <div id="men-list" class="shop-product-grid"></div>
        <div id="men-empty" class="shop-empty-state" style="display:none;">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6l10 10l-6 6l-10 -10z"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor" stroke="none"/></svg>
          <p>No Men items yet</p>
          <span>Check back soon — new drops incoming.</span>
        </div>
      </div>
      <div class="shop-page-col">
        <h2>Women</h2>
        <div id="women-list" class="shop-product-grid"></div>
        <div id="women-empty" class="shop-empty-state" style="display:none;">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h6l10 10l-6 6l-10 -10z"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor" stroke="none"/></svg>
          <p>No Women items yet</p>
          <span>Check back soon — new drops incoming.</span>
        </div>
      </div>
    </div>
  </main>

  <script src="/shop.js"></script>
</body>
</html>
